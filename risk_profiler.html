<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allianz Risk Profiler</title>
<link rel="stylesheet" href="https://elements.cdn.allianz.com/master/dist/a1-elements/a1-elements.css">
<!--
  Standalone Risk Profiler. It uses the same three files as the Quotation Tool, with no other dependencies:
    js/risk_profiler_data.js   questionnaire, scores, wording
    js/risk_profiler.js        scoring engine
    js/risk_profiler_ui.js     the questionnaire and result, mounted into any element
  To put it on a website, copy those three files and the few lines in the script below.
-->
<style>
:root { --ink:#0E1E33; --body:#3A4756; --muted:#5E6B78; --navy:#003781; --teal:#0377A8; --bg:#F4F7FA; --line:#E2E8EF; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Allianz Neo', Arial, Helvetica, sans-serif; font-size:14px; line-height:1.45; font-variant-numeric:tabular-nums; }
header.top { display:flex; align-items:center; gap:16px; padding:18px 48px; background:#fff; border-bottom:1px solid var(--line); }
header.top img { height:24px; }
header.top b { font-size:15px; color:var(--navy); }
main { max-width:1000px; margin:0 auto; padding:48px 48px 64px; }
.eyebrow { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); }
h1 { margin:8px 0; font-size:32px; line-height:1.15; color:var(--navy); letter-spacing:-.01em; }
.lead { max-width:640px; margin:0 0 32px; font-size:15px; line-height:1.55; color:var(--muted); }
@media (max-width: 600px) { header.top { padding:16px 20px; } main { padding:28px 16px 48px; } h1 { font-size:26px; } }
@media print { header.top, .lead { display:none; } body { background:#fff; } main { padding:0; } }
</style>
</head>
<body>
<header class="top"><img src="allianz-logo.svg" alt="Allianz"><b>Risk Profiler</b></header>
<main>
  <div class="eyebrow">Risk profile</div>
  <h1>Find your risk profile</h1>
  <p class="lead">Answer the questions in each of the five parts. Your answers show how much investment risk suits you, and how well you could cope with a fall in value. Nothing is stored or sent anywhere.</p>
  <div id="rp-host"></div>
</main>
<script src="js/risk_profiler_data.js"></script>
<script src="js/risk_profiler.js"></script>
<script src="js/risk_profiler_ui.js"></script>
<script>
  var profiler = RiskProfilerUI.mount(document.getElementById('rp-host'), {
    onChange: function(state) { /* state.answers and state.result: send them wherever you need */ }
  });
</script>
</body>
</html>
