<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<aside style="width:272px;flex:none;align-self:stretch;background:#fff;border-right:1px solid #E2E8EF;display:flex;flex-direction:column;font-family:Figtree,Arial,sans-serif;color:#0E1E33">
  <div style="position:sticky;top:0;display:flex;flex-direction:column;min-height:900px">
    <div style="padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid #EDF1F5">
      <img src="allianz-logo.svg" alt="Allianz" style="height:24px;width:auto;align-self:flex-start">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:15px;font-weight:700;color:#003781">Quotation Tool</div>
        <div style="font-size:12px;color:#5E6B78;font-variant-numeric:tabular-nums">Ref. Q-261008-GAQ6</div>
      </div>
    </div>
    <nav style="padding:18px 14px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="7">
        <div style="{{ s.rowStyle }}">
          <div style="{{ s.dotStyle }}">{{ s.mark }}</div>
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
            <div style="{{ s.labelStyle }}">{{ s.label }}</div>
            <div style="font-size:12px;color:#5E6B78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.cap }}</div>
          </div>
        </div>
      </sc-for>
    </nav>
    <div style="margin-top:auto;padding:18px 24px 24px;border-top:1px solid #EDF1F5;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;color:#5E6B78;line-height:1.45">Adviser details are saved in this browser. Client details are cleared when you close the quote.</div>
      <div style="display:flex;gap:14px;font-size:12px;font-weight:600;color:#0377A8">
        <span>Export settings</span><span>Import settings</span>
      </div>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:272,&quot;height&quot;:900},&quot;step&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:7,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.step ?? 1;
    const L = [
      ['Adviser', 'Sarah Kelly · Test Financial Ltd'],
      ['Product & client', 'PRSA · Mr Alex Murphy'],
      ['Attitude to risk', '4 · Medium · ESG preference'],
      ['Plan details', 'Non-Standard A5 · €70k + €500/m'],
      ['Portfolio', 'Own selection · 4 funds'],
      ['Results', '€307,635 at 65'],
      ['Quotation pack', '']
    ];
    const steps = L.map(([label, cap], i) => {
      const n = i + 1, done = n < cur, on = n === cur;
      return {
        label, mark: done ? '✓' : String(n),
        cap: done ? cap : on ? 'In progress' : '',
        rowStyle: `display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:8px;background:${on ? '#EEF4FA' : 'transparent'}`,
        dotStyle: `flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;${done ? 'background:#E6F2EA;color:#0B7A3E' : on ? 'background:#003781;color:#fff' : 'background:#fff;color:#8A96A3;box-shadow:inset 0 0 0 1.5px #D5DDE6'}`,
        labelStyle: `font-size:14px;font-weight:${on ? 700 : 600};color:${on ? '#003781' : done ? '#0E1E33' : '#8A96A3'}`
      };
    });
    return { steps };
  }
}
</script>
</body>
</html>
